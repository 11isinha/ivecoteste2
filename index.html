                        <span className="text-slate-400 block text-[10px]">Diagnóstico:</span>
                        <span className="font-semibold text-slate-200">{scannedResult.condition}</span>
                      </div>
                      <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                        <span className="text-slate-400 block text-[10px]">Filamento Recomendado:</span>
                        <span className="font-semibold text-cyan-400">{scannedResult.material}</span>
                      </div>
                    </div>

                    <button onClick={() => sendTo3DPrinter(scannedResult.name)} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl transition flex items-center justify-center gap-2">
                      <Printer className="w-4 h-4" /> Enviar para Fila de Impressão 3D
                    </button>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* MODAL CADASTRO */}
          {showCadastrarModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white flex items-center gap-2">
                    <PlusCircle className="w-5 h-5 text-emerald-400" />
                    Cadastrar Nova Peça no Estoque
                  </h3>
                  <button onClick={() => setShowCadastrarModal(false)} className="text-slate-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleCadastrarPeca} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-300 font-medium block mb-1">Nome da Peça *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Bomba de Alta Pressão"
                      value={newPartName}
                      onChange={e => setNewPartName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-300 font-medium block mb-1">Código IVECO</label>
                      <input
                        type="text"
                        placeholder="Ex: IVE-9921"
                        value={newPartCode}
                        onChange={e => setNewPartCode(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 font-medium block mb-1">Quantidade</label>
                      <input
                        type="number"
                        min="1"
                        value={newPartQuantity}
                        onChange={e => setNewPartQuantity(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-300 font-medium block mb-1">Localização no Almoxarifado</label>
                    <input
                      type="text"
                      placeholder="Ex: Prateleira 02 - Gaveta 05"
                      value={newPartLocation}
                      onChange={e => setNewPartLocation(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 font-medium block mb-1">Link da Imagem (Opcional)</label>
                    <input
                      type="url"
                      placeholder="https://exemplo.com/foto.jpg"
                      value={newPartImageUrl}
                      onChange={e => setNewPartImageUrl(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 font-medium block mb-1">Status do Item</label>
                    <select
                      value={newPartStatus}
                      onChange={e => setNewPartStatus(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                      <option value="Disponível">Disponível</option>
                      <option value="Indisponível">Indisponível</option>
                    </select>
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button type="button" onClick={() => setShowCadastrarModal(false)} className="flex-1 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl transition">Cancelar</button>
                    <button type="submit" className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition shadow-lg">Salvar Peça</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL DETALHES PEÇA LOCAL */}
          {selectedPart && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-2xl space-y-5 shadow-2xl relative">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-0.5 rounded-full">IVECO São Paulo</span>
                    <h3 className="text-sm font-extrabold text-white">Detalhes do Componente</h3>
                  </div>
                  <button onClick={() => setSelectedPart(null)} className="text-slate-400 hover:text-white font-bold text-xs bg-slate-800 px-3 py-1.5 rounded-lg">Fechar [X]</button>
                </div>

                <div className="relative aspect-video bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
                  <img src={selectedPart.images[activeImageIdx]} alt="Componente IVECO" className="w-full h-full object-cover" />
                </div>

                <div className="bg-slate-950 rounded-2xl p-4 border border-slate-800 space-y-3 text-xs">
                  <div>
                    <h4 className="font-extrabold text-sm text-white uppercase">{selectedPart.name}</h4>
                    <p className="text-[11px] font-mono text-slate-400">Código: {selectedPart.code}</p>
                  </div>

                  <div className="grid grid-cols-2 gap-4 border-t border-b border-slate-800 py-3">
                    <div><span className="text-[10px] text-slate-500 block uppercase font-bold">STATUS</span><span className="font-bold text-emerald-400">{selectedPart.status}</span></div>
                    <div><span className="text-[10px] text-slate-500 block uppercase font-bold">QUANTIDADE</span><span className="font-bold text-slate-200">{selectedPart.quantity} unidades</span></div>
                    <div><span className="text-[10px] text-slate-500 block uppercase font-bold">CONDIÇÃO</span><span className="font-bold text-slate-200">{selectedPart.condition}</span></div>
                    <div><span className="text-[10px] text-slate-500 block uppercase font-bold">LOCALIZAÇÃO</span><span className="font-bold text-slate-200">{selectedPart.location}</span></div>
                  </div>
                </div>

                <button onClick={() => { sendTo3DPrinter(selectedPart.name); setSelectedPart(null); }} className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs py-3 rounded-xl transition flex items-center justify-center gap-2">
                  <Printer className="w-4 h-4" /> Solicitar Réplica no Hub 3D
                </button>
              </div>
            </div>
          )}

          {/* MODAL DETALHES PEÇA DA REDE */}
          {selectedNetworkPart && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-blue-500/30 rounded-3xl p-6 w-full max-w-2xl space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold bg-blue-500/10 text-blue-400 border border-blue-500/30 px-2.5 py-0.5 rounded-full flex items-center gap-1">
                      <Network className="w-3 h-3" /> Rede IVECO 3D
                    </span>
                    <h3 className="text-sm font-extrabold text-white">Peça em Outro Hub 3D</h3>
                  </div>
                  <button onClick={() => setSelectedNetworkPart(null)} className="text-slate-400 hover:text-white font-bold text-xs bg-slate-800 px-3 py-1.5 rounded-lg">Fechar [X]</button>
                </div>

                <div className="relative aspect-video bg-slate-950 rounded-2xl overflow-hidden border border-slate-800">
                  <img src={selectedNetworkPart.images[0]} alt={selectedNetworkPart.name} className="w-full h-full object-cover" />
                  <span className={`absolute top-3 right-3 text-[10px] font-extrabold px-2.5 py-1 rounded-full border shadow-lg ${
                    selectedNetworkPart.status === 'Pronta na Prateleira 3D' ? 'bg-emerald-500 text-slate-950 border-emerald-300' :
                    'bg-cyan-500 text-slate-950 border-cyan-300'
                  }`}>
                    {selectedNetworkPart.status}
                  </span>
                </div>

                <div className="bg-slate-950 rounded-2xl p-4 border border-slate-800 space-y-3 text-xs">
                  <div>
                    <h4 className="font-extrabold text-sm text-white uppercase">{selectedNetworkPart.name}</h4>
                    <p className="text-[11px] font-mono text-slate-400">Código: {selectedNetworkPart.code}</p>
                  </div>

                  <div className="grid grid-cols-2 gap-4 border-t border-b border-slate-800 py-3">
                    <div>
                      <span className="text-[10px] text-slate-500 block uppercase font-bold">UNIDADE ORIGEM</span>
                      <span className="font-bold text-blue-400">{selectedNetworkPart.unit}</span>
                      <p className="text-[10px] text-slate-500 mt-0.5">{selectedNetworkPart.unitCity}</p>
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-500 block uppercase font-bold">DISTÂNCIA</span>
                      <span className="font-bold text-slate-200">{selectedNetworkPart.distance}</span>
                      <p className="text-[10px] text-slate-500 mt-0.5">Entrega: {selectedNetworkPart.deliveryEst}</p>
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-500 block uppercase font-bold">QUANTIDADE</span>
                      <span className="font-bold text-slate-200">{selectedNetworkPart.quantity} unidades</span>
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-500 block uppercase font-bold">CONDIÇÃO</span>
                      <span className="font-bold text-slate-200">{selectedNetworkPart.condition}</span>
                    </div>
                  </div>

                  {/* DADOS DE MANUFATURA ADITIVA */}
                  <div className="bg-gradient-to-br from-cyan-950/40 to-slate-950 border border-cyan-500/20 rounded-xl p-3 space-y-2">
                    <div className="flex items-center gap-2 mb-1">
                      <Printer className="w-3.5 h-3.5 text-cyan-400" />
                      <span className="text-[10px] font-bold text-cyan-300 uppercase">Dados de Manufatura Aditiva</span>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-[10px]">
                      <div>
                        <span className="text-slate-500 block">Material</span>
                        <span className="font-bold text-cyan-300">{selectedNetworkPart.material}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 block">Tempo de Impressão</span>
                        <span className="font-bold text-amber-300">{selectedNetworkPart.printTime}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 block">Peso</span>
                        <span className="font-bold text-slate-200">{selectedNetworkPart.weight}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 block">CO₂ Evitado</span>
                        <span className="font-bold text-emerald-300">{selectedNetworkPart.co2Saved}</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-blue-950/30 border border-blue-500/20 rounded-xl p-3 space-y-2">
                    <span className="text-[10px] font-bold text-blue-300 uppercase">Contato da Unidade</span>
                    <div className="flex items-center gap-2 text-slate-300">
                      <Phone className="w-3 h-3 text-blue-400" />
                      <span className="font-mono">{selectedNetworkPart.contact.phone}</span>
                    </div>
                    <div className="flex items-center gap-2 text-slate-300">
                      <Mail className="w-3 h-3 text-blue-400" />
                      <span className="font-mono text-[11px]">{selectedNetworkPart.contact.email}</span>
                    </div>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => handleContatarUnidade(selectedNetworkPart)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs py-3 rounded-xl transition flex items-center justify-center gap-2 border border-slate-700">
                    <Phone className="w-4 h-4" /> Contatar Unidade
                  </button>
                  <button onClick={() => handleSolicitarPecaRede(selectedNetworkPart)} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                    <SendHorizontal className="w-4 h-4" /> Solicitar Transferência
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE SOLICITAÇÕES */}
          {showRequestsModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-2xl space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <Truck className="w-5 h-5 text-blue-400" />
                    <h3 className="text-sm font-extrabold text-white">Minhas Solicitações à Rede IVECO 3D</h3>
                  </div>
                  <button onClick={() => setShowRequestsModal(false)} className="text-slate-400 hover:text-white font-bold text-xs bg-slate-800 px-3 py-1.5 rounded-lg">Fechar [X]</button>
                </div>

                {requestList.length === 0 ? (
                  <div className="text-center py-12 space-y-3">
                    <Truck className="w-12 h-12 text-slate-700 mx-auto" />
                    <p className="text-xs text-slate-400">Nenhuma solicitação feita ainda.</p>
                    <p className="text-[10px] text-slate-500">Vá em "Estoque de Peças" → "Rede IVECO 3D" e solicite uma transferência.</p>
                  </div>
                ) : (
                  <div className="space-y-3 max-h-[500px] overflow-y-auto">
                    {requestList.map(req => (
                      <div key={req.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="text-[10px] font-mono text-blue-400 font-bold">{req.id}</p>
                            <h4 className="font-bold text-xs text-white mt-0.5">{req.part}</h4>
                            <p className="text-[10px] font-mono text-slate-500">Cód: {req.code}</p>
                          </div>
                          <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${
                            req.status === 'Aguardando Impressão' 
                              ? 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30'
                              : 'bg-amber-500/10 text-amber-400 border-amber-500/30'
                          }`}>
                            {req.status}
                          </span>
                        </div>

                        <div className="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800 text-[10px]">
                          <div>
                            <span className="text-slate-500 block">Origem</span>
                            <span className="font-bold text-slate-200">{req.fromUnit}</span>
                            <p className="text-slate-500">{req.fromCity}</p>
                          </div>
                          <div>
                            <span className="text-slate-500 block">Distância</span>
                            <span className="font-bold text-slate-200">{req.distance}</span>
                            <p className="text-slate-500">Solicitado em {req.date}</p>
                          </div>
                          <div className="col-span-2">
                            <span className="text-slate-500 block">Manufatura</span>
                            <span className="font-bold text-cyan-300">{req.material}</span>
                            <p className="text-slate-500">Tempo de impressão: {req.printTime}</p>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
