<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVECO ECOOFICINA 4.0 • Hub de Manufatura Aditiva & ESG</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            iveco: { blue: '#003896', light: '#0057b8', cyan: '#00c2cb' }
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b1120; color: #f8fafc; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#0B0F17] text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const LucideIcon = ({ name, className = "w-4 h-4", ...props }) => {
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: spanRef.current });
        }
      }, [name, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" {...props}></span>;
    };

    const LayoutDashboard = (p) => <LucideIcon name="layout-dashboard" {...p} />;
    const Leaf = (p) => <LucideIcon name="leaf" {...p} />;
    const Sparkles = (p) => <LucideIcon name="sparkles" {...p} />;
    const PackageCheck = (p) => <LucideIcon name="package-check" {...p} />;
    const RefreshCw = (p) => <LucideIcon name="refresh-cw" {...p} />;
    const Camera = (p) => <LucideIcon name="camera" {...p} />;
    const ScanLine = (p) => <LucideIcon name="scan-line" {...p} />;
    const CheckCircle2 = (p) => <LucideIcon name="check-circle-2" {...p} />;
    const Printer = (p) => <LucideIcon name="printer" {...p} />;
    const Wrench = (p) => <LucideIcon name="wrench" {...p} />;
    const Layers = (p) => <LucideIcon name="layers" {...p} />;
    const Thermometer = (p) => <LucideIcon name="thermometer" {...p} />;
    const XCircle = (p) => <LucideIcon name="x-circle" {...p} />;
    const Eye = (p) => <LucideIcon name="eye" {...p} />;
    const PlusCircle = (p) => <LucideIcon name="plus-circle" {...p} />;
    const Bell = (p) => <LucideIcon name="bell" {...p} />;
    const X = (p) => <LucideIcon name="x" {...p} />;

    const INITIAL_STOCK = [
      { 
        id: '1', 
        name: 'ALAVANCA COMANDO VALVULA IVECO STRALIS', 
        code: '425141', 
        status: 'Disponível', 
        quantity: 2,
        condition: 'Recuperável',
        year: 2024,
        location: 'Almoxarifado B – Prateleira 04 – Gaveta 12',
        compatibility: 'IVECO S-WAY / STRALIS',
        material: 'PA12-CF (Reforçado Fibra de Carbono)',
        images: [
          'https://perimpecas.com.br/fotos/425141.jpg',
          'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSrURse1orkGDX9fJPsbo4i67fbuRuMEYqbjxKKfQB3cV07ios1kNFhhME&s=10'
        ]
      },
      { 
        id: '2', 
        name: 'Engrenagem do acionamento de acessórios do motor', 
        code: 'IVE-SUP-881', 
        status: 'Disponível', 
        quantity: 5,
        condition: 'Novo 3D Homologado',
        year: 2026,
        location: 'Almoxarifado A – Prateleira 01 – Gaveta 03',
        compatibility: 'IVECO S-WAY / TECTOR',
        material: 'PEEK Alta Resistência Termal',
        images: [
          'https://images.tcdn.com.br/img/img_prod/920964/engrenagem_do_comando_de_valvula_para_iveco_cursor_8_euro_3_99436187_17565_1_4e7fa24537e2bc9521e272a7a40cdedb.jpg'
        ]
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [stockList, setStockList] = useState(INITIAL_STOCK);
      const [selectedPart, setSelectedPart] = useState(null);
      const [activeImageIdx, setActiveImageIdx] = useState(0);
      const [searchTerm, setSearchTerm] = useState('');
      const [stockFilter, setStockFilter] = useState('Todos');

      // Modais e Cadastro
      const [showCadastrarModal, setShowCadastrarModal] = useState(false);
      const [newPartName, setNewPartName] = useState('');
      const [newPartCode, setNewPartCode] = useState('');
      const [newPartQuantity, setNewPartQuantity] = useState('1');
      const [newPartLocation, setNewPartLocation] = useState('Almoxarifado Principal');
      const [newPartImageUrl, setNewPartImageUrl] = useState('');
      const [newPartStatus, setNewPartStatus] = useState('Disponível');

      const [toastMessage, setToastMessage] = useState(null);
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const handleCadastrarPeca = (e) => {
        e.preventDefault();
        if (!newPartName.trim()) return;

        const newPart = {
          id: String(Date.now()),
          name: newPartName.toUpperCase(),
          code: newPartCode.trim() || `IVE-${Math.floor(1000 + Math.random() * 9000)}`,
          status: newPartStatus,
          quantity: Number(newPartQuantity) || 1,
          condition: 'Novo Cadastrado',
          year: new Date().getFullYear(),
          location: newPartLocation,
          compatibility: 'IVECO Frota Pesada',
          material: 'PA12-CF Polímero Reforçado',
          images: [
            newPartImageUrl.trim() || 'https://images.tcdn.com.br/img/img_prod/920964/engrenagem_do_comando_de_valvula_para_iveco_cursor_8_euro_3_99436187_17565_1_4e7fa24537e2bc9521e272a7a40cdedb.jpg'
          ]
        };

        setStockList([newPart, ...stockList]);
        setShowCadastrarModal(false);
        setNewPartName('');
        setNewPartCode('');
        setNewPartQuantity('1');
        setNewPartImageUrl('');
        triggerToast(`Peça "${newPart.name}" cadastrada com sucesso!`);
        setActiveTab('stock');
      };

      const filteredStock = stockList.filter(item => {
        const matches = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                        item.code.toLowerCase().includes(searchTerm.toLowerCase());
        if (stockFilter === 'Todos') return matches;
        return matches && item.status === stockFilter;
      });

      return (
        <div className="min-h-screen bg-[#0B0F17] text-slate-100 flex font-sans antialiased">
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-emerald-500 text-slate-950 font-extrabold text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 border border-emerald-300 animate-bounce">
              <CheckCircle2 className="w-4 h-4" />
              <span>{toastMessage}</span>
            </div>
          )}

          <aside className="w-64 bg-[#0F172A] border-r border-slate-800 flex flex-col justify-between shrink-0 hidden md:flex">
            <div>
              <div className="p-5 border-b border-slate-800 flex items-center gap-3">
                <div className="bg-blue-600 font-black text-white text-base px-2.5 py-1 rounded tracking-tighter">
                  IVECO
                </div>
                <div>
                  <h1 className="font-extrabold text-sm tracking-wide text-white">
                    ECOOFICINA <span className="text-emerald-400 text-xs">4.0</span>
                  </h1>
                  <p className="text-[10px] text-slate-400 font-mono">REDE BRASIL</p>
                </div>
              </div>

              <nav className="p-3 space-y-1 text-xs">
                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium transition ${activeTab === 'dashboard' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}`}>
                  <LayoutDashboard className="w-4 h-4" /> Dashboard
                </button>
                <button onClick={() => setActiveTab('stock')} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg font-medium transition ${activeTab === 'stock' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}`}>
                  <div className="flex items-center gap-2.5">
                    <PackageCheck className="w-4 h-4" /> Estoque de Peças
                  </div>
                  <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full">{stockList.length}</span>
                </button>
                <button onClick={() => setActiveTab('esg')} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium transition ${activeTab === 'esg' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}`}>
                  <Leaf className="w-4 h-4 text-emerald-400" /> Relatório ESG
                </button>
              </nav>
            </div>
          </aside>

          <main className="flex-1 overflow-y-auto p-4 md:p-8">
            <header className="flex items-center justify-between border-b border-slate-800 pb-5 mb-6">
              <h2 className="text-lg font-bold text-white">HUB DE INOVAÇÃO & GESTÃO</h2>
              <button onClick={() => setShowCadastrarModal(true)} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-lg">
                <PlusCircle className="w-4 h-4" /> + Cadastrar Peça
              </button>
            </header>

            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                  <h3 className="text-xl font-bold text-white mb-2">Bem-vindo à Ecooficina IVECO 4.0</h3>
                  <p className="text-xs text-slate-400 mb-4">Gerencie seu estoque e adicione novas peças diretamente no sistema.</p>
                  <button onClick={() => setActiveTab('stock')} className="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2 rounded-xl">
                    Ver Estoque Atual ({stockList.length} itens)
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'stock' && (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                  <div className="w-full md:w-auto">
                    <h3 className="text-lg font-bold text-white">Estoque de Peças Cadastradas</h3>
                    <p className="text-xs text-slate-400">Gerencie componentes e adicione novos itens</p>
                  </div>
                  <div className="flex gap-2 w-full md:w-auto">
                    <input 
                      type="text" 
                      placeholder="Buscar peça..." 
                      value={searchTerm} 
                      onChange={e => setSearchTerm(e.target.value)}
                      className="bg-slate-900 border border-slate-800 text-xs text-white rounded-xl px-4 py-2.5 w-full md:w-64 focus:outline-none focus:border-emerald-500" 
                    />
                    <button onClick={() => setShowCadastrarModal(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-xl whitespace-nowrap">
                      + Nova Peça
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {filteredStock.map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between">
                      <div>
                        <div className="relative aspect-video bg-slate-950 overflow-hidden">
                          <img src={item.images[0]} alt={item.name} className="w-full h-full object-cover" />
                          <span className="absolute top-2 right-2 text-[10px] font-extrabold px-2 py-1 rounded-full bg-emerald-500 text-slate-950">
                            {item.status}
                          </span>
                        </div>
                        <div className="p-4 space-y-2">
                          <h4 className="font-bold text-xs text-white leading-snug">{item.name}</h4>
                          <p className="text-[10px] font-mono text-emerald-400">Código: {item.code}</p>
                          <p className="text-[11px] text-slate-400">Qtd: {item.quantity} | Local: {item.location}</p>
                        </div>
                      </div>
                      <div className="p-4 pt-0">
                        <button onClick={() => setSelectedPart(item)} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs py-2 rounded-xl">
                          Ver Detalhes
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* MODAL CADASTRAR PEÇA */}
          {showCadastrarModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-sm text-white flex items-center gap-2">
                    <PlusCircle className="w-4 h-4 text-emerald-400" /> Cadastrar Nova Peça
                  </h3>
                  <button onClick={() => setShowCadastrarModal(false)} className="text-slate-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleCadastrarPeca} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-300 font-medium block mb-1">Nome da Peça *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Alternador Reforçado"
                      value={newPartName}
                      onChange={e => setNewPartName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-300 font-medium block mb-1">Código</label>
                      <input
                        type="text"
                        placeholder="Ex: IVE-100"
                        value={newPartCode}
                        onChange={e => setNewPartCode(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 font-medium block mb-1">Quantidade</label>
                      <input
                        type="number"
                        min="1"
                        value={newPartQuantity}
                        onChange={e => setNewPartQuantity(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-300 font-medium block mb-1">Localização</label>
                    <input
                      type="text"
                      placeholder="Ex: Prateleira 01"
                      value={newPartLocation}
                      onChange={e => setNewPartLocation(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 font-medium block mb-1">Link da Imagem (Opcional)</label>
                    <input
                      type="url"
                      placeholder="https://site.com/foto.jpg"
                      value={newPartImageUrl}
                      onChange={e => setNewPartImageUrl(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button type="button" onClick={() => setShowCadastrarModal(false)} className="flex-1 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl">Cancelar</button>
                    <button type="submit" className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg">Salvar Peça</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL DETALHES */}
          {selectedPart && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-extrabold text-white">Detalhes da Peça</h3>
                  <button onClick={() => setSelectedPart(null)} className="text-slate-400 hover:text-white text-xs bg-slate-800 px-3 py-1 rounded-lg">Fechar</button>
                </div>
                <div className="aspect-video bg-slate-950 rounded-2xl overflow-hidden">
                  <img src={selectedPart.images[0]} className="w-full h-full object-cover" />
                </div>
                <div className="space-y-1 text-xs">
                  <h4 className="font-bold text-white text-sm">{selectedPart.name}</h4>
                  <p className="text-emerald-400 font-mono">Código: {selectedPart.code}</p>
                  <p className="text-slate-400">Quantidade em estoque: {selectedPart.quantity}</p>
                  <p className="text-slate-400">Localização: {selectedPart.location}</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
